# --- Gradle -------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# --- Mod ----------------------------------------------------------------
mod_version=1.2.1
maven_group=net.hiddenhally
archives_base_name=lolcat

# --- Minecraft / Fabric (26.3, non offuscato: nessuna mappings) ----------
# Verifica sempre su https://fabricmc.net/develop
minecraft_version=26.3
