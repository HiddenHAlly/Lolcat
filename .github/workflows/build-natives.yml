# Metti questo file in .github/workflows/build-natives.yml
#
# COSA FA
#   - compila cubiomes_x86.dll  (Windows x86-64, MinGW)
#   - compila libcubiomes_arm.so (Android arm64, NDK)
#   - le inserisce nella root di local-libs/cubiomes-local.jar
#     (stesso posto di libcubiomes_x86.so: il loader Java le trova da solo)
#   - le classi Java NON vengono toccate: nomi di funzioni invariati
#
# DA CONFIGURARE (sezione env)
#   NATIVE_REPO : repo con i sorgenti C usati per costruire la .so originale
#                 (cubiomes + loot_library.h, di solito il fork usato da
#                 dev.xpple.cubiomes). Se hai un tuo fork, mettilo qui.
#   NATIVE_REF  : branch/tag/commit da compilare
#   JAR_PATH    : percorso del jar dentro Lolcat

# Metti questo file in .github/workflows/build-natives.yml del repo Lolcat
#
# COSA FA (lancio manuale: Actions -> build-natives -> Run workflow)
#   - compila cubiomes_x86.dll    (Windows x86-64, MinGW: MSVC NON va bene)
#   - compila libcubiomes_arm.so  (Android arm64, NDK)
#   - le aggiunge nella root di libs/cubiomes-local.jar, accanto a
#     libcubiomes_x86.so. CubiomesInit le trova da solo via
#     System.mapLibraryName("cubiomes_x86" / "cubiomes_arm").
#   - le classi Java non cambiano: nomi di funzioni identici.
#
# DA VERIFICARE (non l'ho potuto provare):
#   - NATIVE_REF: ideale il commit esatto da cui hai compilato la tua .so
#     (cosi' la DLL ha le stesse funzioni dei bindings nel jar).
#   - il CMakeLists di xpple/cubiomes deve produrre una libreria condivisa;
#     i passi "trova e rinomina" cercano il file prodotto, ma se il target
#     e' solo statico bisogna aggiungere -DBUILD_SHARED_LIBS=ON (gia' messo).

name: build-natives

on:
  workflow_dispatch:

env:
  NATIVE_REPO: xpple/cubiomes
  NATIVE_REF: master            # <-- meglio un commit/tag preciso
  JAR_PATH: libs/cubiomes-local.jar

jobs:
  windows-dll:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.NATIVE_REPO }}
          ref: ${{ env.NATIVE_REF }}
          submodules: recursive
          path: native
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Compila la DLL
        working-directory: native
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="-static -static-libgcc"
          cmake --build build
          F=$(find build -maxdepth 2 -name '*.dll' | head -n1)
          echo "Trovata: $F"
          cp "$F" cubiomes_x86.dll
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dll
          path: native/cubiomes_x86.dll

  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.NATIVE_REPO }}
          ref: ${{ env.NATIVE_REF }}
          submodules: recursive
          path: native
      - name: Compila con NDK (bionic, arm64)
        working-directory: native
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
          cmake --build build
          F=$(find build -maxdepth 2 -name '*.so' | head -n1)
          echo "Trovata: $F"
          cp "$F" libcubiomes_arm.so
      - uses: actions/upload-artifact@v4
        with:
          name: android-so
          path: native/libcubiomes_arm.so

  repack-jar:
    needs: [windows-dll, android-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: natives
      - name: Aggiungi le librerie al jar
        run: |
          cp natives/windows-dll/cubiomes_x86.dll .
          cp natives/android-so/libcubiomes_arm.so .
          zip -u "$JAR_PATH" cubiomes_x86.dll libcubiomes_arm.so
          unzip -l "$JAR_PATH" | grep -E 'cubiomes_(x86|arm)'
      - uses: actions/upload-artifact@v4
        with:
          name: cubiomes-local-multiplatform
          path: ${{ env.JAR_PATH }}
